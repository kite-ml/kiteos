#
# KiteOS: allow the station operator to lock 64 MiB of memory so the runtime's Zenoh
# shared-memory transport can pin its 16 MiB pool per session (the runtime's Linux
# memlock check). Without it the runtime asks for sudo on the first launch and
# otherwise falls back to a slower transport.
#
# deploy/install.sh --with-udev replaces KITEOS_USER with the installing user and
# writes the result to /etc/security/limits.d/99-kiteos-memlock.conf.
# pam_limits reads it at login: log out and back in afterwards.
#
# <domain>     <type>  <item>    <value in KiB>
KITEOS_USER    -       memlock   65536
